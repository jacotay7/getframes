# SciMeasure Little Joe wavefront-sensor camera with e2v/Marconi CCD39-01.
# Keck identifies its CCD-39 implementation with the CCD39-01 product sheet:
# https://www2.keck.hawaii.edu/optics/aowg/docs/PDRCommitteeReportResponse.pdf
# Keck low-rate read-noise and inversion-clocking performance:
# https://citeseerx.ist.psu.edu/document?doi=294a085f3760d55d36d87499d28877ae3f4d062d&repid=rep1&type=pdf
name = "Keck/SciMeasure Little Joe CCD39"
manufacturer = "SciMeasure"
model = "Little Joe CCD39 (e2v CCD39-01)"
sensor_type = "CCD"
resolution = [80, 80]
pixel_size_um = 24.0
quantum_efficiency = 0.905             # peak of the typical response curve
full_well_e = 300000.0                 # typical CCD39-01 peak charge storage
bit_depth = 14                         # standard Little Joe digitisation
gain_e_per_adu = 5.0                   # representative Keck controller conversion
bias_offset_adu = 1000.0
read_noise_e = 4.5                     # measured Keck low-frame-rate upper end
dark_current_e_per_s = 0.0             # reported negligible under inversion clocking
dark_current_ref_temp_c = -40.0
dark_current_doubling_temp_c = 6.3
notes = "Keck/SciMeasure low-frame-rate CCD39 operating point; wavelength response is the CCD39-01 typical standard-AR/no-window curve at -20 C. Read noise and dark current are controller, clocking, temperature, and cadence dependent."

# Typical CCD39-01 spectral response at -20 C, with standard AR coating and no
# window. Resampled at 10 nm from the vector trace in the original Marconi
# Applied Technologies datasheet (page 4), rather than estimated from pixels:
# https://instrumentation.obs.carnegiescience.edu/ccd/parts/CCD39-01.pdf
# A real Little Joe camera window and the Keck WFS optics remain separate terms.
[qe_curve]
wavelength_nm = [
    200.0, 210.0, 220.0, 230.0, 240.0, 250.0, 260.0, 270.0, 280.0, 290.0,
    300.0, 310.0, 320.0, 330.0, 340.0, 350.0, 360.0, 370.0, 380.0, 390.0,
    400.0, 410.0, 420.0, 430.0, 440.0, 450.0, 460.0, 470.0, 480.0, 490.0,
    500.0, 510.0, 520.0, 530.0, 540.0, 550.0, 560.0, 570.0, 580.0, 590.0,
    600.0, 610.0, 620.0, 630.0, 640.0, 650.0, 660.0, 670.0, 680.0, 690.0,
    700.0, 710.0, 720.0, 730.0, 740.0, 750.0, 760.0, 770.0, 780.0, 790.0,
    800.0, 810.0, 820.0, 830.0, 840.0, 850.0, 860.0, 870.0, 880.0, 890.0,
    900.0, 910.0, 920.0, 930.0, 940.0, 950.0, 960.0, 970.0, 980.0, 990.0,
    1000.0,
