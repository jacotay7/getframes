# First Light Imaging C-RED One — full-frame global-reset raw-read operating point.
#
# Camera-wide spatial/read-noise terms are fitted to CRED1 dark cubes collected
# 2026-07-15 at 84.6 K. The plastic cap was near 18 C and is therefore a thermal
# IR source; its ~560 e-/pixel/s total inferred ramp is deliberately NOT baked into the
# detector dark current. Add that scene-dependent term through `background`.
name = "First Light Imaging C-RED One"
manufacturer = "First Light Imaging"
model = "C-RED One (SAPHIRA, global-reset raw)"
sensor_type = "EAPD"
resolution = [256, 320]
pixel_size_um = 24.0
quantum_efficiency = 0.70
full_well_e = 60000.0
output_full_well_e = 105000.0
bit_depth = 16
# Ammeter method, First Light acceptance report TR_0778KECK-CR1_2024_0057 s4.2,
# for this serial number. The local cubes give 2.407 e-/ADU from a photon
# transfer curve, but a PTC reads the gain high when inter-pixel capacitance
# suppresses pixel-to-pixel variance, and the vendor report says explicitly that
# the ammeter method is preferred "because it is insensitive to the correlated
# noise perturbation and requires no hypothesis on the noise like for the PTC".
# The 1.287x ratio between the two implies ~2.8% IPC per neighbour, which is
# where ipc_coupling below now sits.
gain_e_per_adu = 1.87
# This is the setting-50 operating point. Edge/channel structure raises the
# central pedestal to the measured ~21,964 ADU array median.
bias_offset_adu = 20998.0
# 28.86 ADU measured per-pixel at unity gain and 3.5 kHz, x 1.87 e-/ADU. The
# unity-gain cubes are the clean ones: their noise does not depend on how many
# frames were taken, so nothing is accumulating in them.
read_noise_e = 54.0
# Fitted to the vendor's CDS measurement (report s4.4: 0.87 e- at gain x50,
# 1720 fps, and s4.5: 0.86 e- against both an 80 K blackbody and a room
# temperature blank). Two thirds of the read-noise variance is common to the two
# reads of a CDS pair and cancels; only sqrt(2*(1-f)) of it survives. Nothing in
# the local cubes constrains this -- they were all taken in global-reset burst
# mode, never in CDS -- so it comes from the vendor report alone.
read_noise_correlated_fraction = 0.676
# Deliberately zero. The local cubes appear to show a large gain-dependent
# excess read noise (49.4 ADU at setting 50, 82.8 ADU at setting 100, against
# 28.9 ADU at unity), and the previous fit put 3.3 e- of avalanche input noise
# there. It is not read noise: it grows with the number of frames in the cube
# (setting 100 reads 52.5 ADU over 100 frames and 82.8 ADU over 250), which read
# noise cannot do, and the growth scales with avalanche gain. It is the warm
# plastic cap's photon shot noise being multiplied. The vendor's cold-source CDS
# measurement is consistent with no excess term at all.
avalanche_input_noise_e = 0.0
# Requested setting 50 measured as 21.7x physical multiplication in the capped
# 35 Hz ramps. Published C-RED One gain-calibration slopes are camera-dependent.
em_gain = 21.7
avalanche_gain_nonuniformity = 0.026
# Lanthermann et al. measure <M^2>/<M>^2 = 1.47. getframes uses the square-root
# convention (the multiplier on standard deviation), hence sqrt(1.47) here.
excess_noise_factor = 1.2124

# Unity-gain, 3.5 kHz raw cubes: median temporal noise 28.7 ADU; log-normal
# per-pixel core width 0.185. Separating the 32-channel component leaves ~0.10
# pixel-level width and 0.158 channel-level width. The outer edge is ~1.4x noisier.
read_noise_nonuniformity = 0.10
read_noise_rts_fraction = 0.0015
read_noise_rts_factor = 4.0
readout_channel_count = 32
readout_channel_axis = 1
read_noise_channel_nonuniformity = 0.158
read_noise_edge_factor = 1.4
read_noise_edge_scale_px = 2.0
readout_common_mode_noise_adu = 69.0
readout_common_mode_correlation = 0.995
ndr_bias_offset_adu_per_s = 51700.0
ndr_bias_gain_coefficient_adu_per_s = 1730.0
ndr_common_mode_gain_noise_adu_per_s = 0.0
# Slow capped ramps have a repeatable first-read reset undershoot rather than
# large white frame-to-frame common mode: ~-1,130 ADU at physical gain 21.7.
ndr_reset_settling_input_e = 120.0
ndr_reset_settling_scale_reads = 0.30
ndr_reset_settling_reference_interval_s = 0.02857143
ndr_reset_settling_interval_exponent = 0.40

# Raw-read fixed pattern: ~424 ADU interleaved-channel RMS and a ~3.3 kADU measured
# outer-edge rise. The procedural edge/base amplitudes jointly match the full-map
# 1--99% range and spatial RMS rather than copying one camera's calibration frame.
bias_structure_amplitude_adu = 2850.0
bias_channel_spread_adu = 290.0
bias_pixel_spread_adu = 250.0
bias_edge_amplitude_adu = 4600.0
bias_edge_scale_px = 28.0
bias_edge_axis = 1
bias_edge_secondary_amplitude_adu = 1800.0
bias_edge_secondary_scale_px = 4.0
bias_edge_secondary_axis = 0

# Vendor report s4.6: 2.65 e-/s measured at 80 K behind an 80 K cold stop. The
# 48.8 e-/s of s4.7 is with a room-temperature blank, i.e. warm-optics thermal
# background, which belongs in the scene's `background` term and not here -- the
# previous 80.0 conflated the two and double-counted it.
dark_current_e_per_s = 2.65
detector_glow_e_per_s = 0.0
detector_glow_edge_scale_px = 0.0
dark_current_ref_temp_c = -193.15
dark_current_doubling_temp_c = 8.0
dark_current_nonuniformity = 0.10
hot_pixel_fraction = 0.0003
hot_pixel_factor = 50.0
# Split-half repeated-ramp covariance gives 5.5% high-pass response RMS. This is
# the combined detector response and any stable small-scale cap illumination.
prnu = 0.055
# Successive 200-read ramps show little additional per-pixel reset scatter beyond
# the measured read-noise map; retain a small non-zero kTC term rather than the
# unconstrained amplifier-noise-sized value used by the generic detector preset.
reset_noise_e = 5.0
# Implied by the 1.287x disagreement between the local PTC conversion gain and
# the vendor's ammeter value: a PTC overestimates the gain by ~1/(1-8a). Not
# measured directly; a flat-field autocorrelation would settle it.
ipc_coupling = 0.028
notes = "C-RED One raw global-reset profile at requested eAPD setting 50, measured as 21.7x effective multiplication on this camera. Conversion gain, CDS read noise, and dark current come from First Light acceptance report TR_0778KECK-CR1_2024_0057 for this serial number; spatial structure, channel/edge signatures, bias, reset cadence, and the effective-gain table are fitted to local 84.6 K CRED1 cubes. Those cubes were all taken in global-reset burst mode and constrain single-read behaviour only; the CDS split comes from the report. QE, full well, ENF, format, and speed are FLI/Oxford specifications. Add a room-temperature cap or warm optics as incident thermal background rather than as dark current."

[extra]
operating_mode = "global reset, nondestructive raw reads"
nominal_full_frame_fps = 3500.0
detector_temperature_k = 84.6
local_characterization = "cred1data/dark, acquired 2026-07-15"
requested_eapd_gain = 50.0
measured_effective_avalanche_gain = 21.7
measured_capped_total_rate_e_per_s = 560.0
acceptance_report = "TR_0778KECK-CR1_2024_0057, First Light Imaging, 18/12/2024"
measured_cds_read_noise_e = 0.87
measured_cds_read_noise_gain = 50.0
measured_cds_read_noise_fps = 1720.0
measured_conversion_gain_e_per_adu = 1.87
source_url = "https://andor.oxinst.com/products/c-red-series/c-red-one"
characterization_url = "https://arxiv.org/abs/2409.04247"
performance_url = "https://arxiv.org/abs/2208.00377"

[qe_curve]
# Digitized from the manufacturer curve: 60% from 0.80--0.95 um, linear rise
# to 80% at 1.45 um, then 80% through 2.50 um.
wavelength_nm = [800.0, 950.0, 1200.0, 1450.0, 2500.0]
qe = [0.60, 0.60, 0.70, 0.80, 0.80]
