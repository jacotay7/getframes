# Teledyne Photometrics Prime 95B — back-illuminated scientific CMOS.
# Manufacturer datasheet:
# https://www.photometrics.com/wp-content/uploads/2019/10/Prime-95B-Datasheet-07172020.pdf
name = "Teledyne Photometrics Prime 95B"
manufacturer = "Teledyne Photometrics"
model = "Prime 95B"
sensor_type = "SCMOS"
resolution = [1200, 1200]
pixel_size_um = 11.0
quantum_efficiency = 0.95
full_well_e = 80000.0
bit_depth = 16
gain_e_per_adu = 1.25                 # representative combined-gain conversion
bias_offset_adu = 100.0
read_noise_e = 1.8                    # RMS (1.6 e- median)
read_noise_nonuniformity = 0.2
dark_current_e_per_s = 0.3
dark_current_ref_temp_c = -25.0       # liquid-cooled specification
dark_current_doubling_temp_c = 6.0
prnu = 0.005
nonlinearity = 0.005
dark_current_nonuniformity = 0.03
supported_binnings = [1, 2]             # 2x2 FPGA post-readout (digital) binning
binning_method = "digital"
notes = "Combined-gain 16-bit mode; published peak QE and liquid-cooled dark current."

[extra]
readout_modes = ["16-bit combined gain", "12-bit full well", "12-bit balanced", "12-bit sensitivity"]
source_modes_url = "https://www.photometrics.com/wp-content/uploads/2019/10/95B-Manual_08062020.pdf"

# Wavelength-resolved quantum efficiency, digitized from the manufacturer QE plot
# (UV peak near 240 nm, broad ~550-600 nm plateau, NIR etaloning ripples above
# ~800 nm typical of a thinned back-illuminated sensor). Optional; only used in
# spectral mode (Camera.observe with a band that has a spectral response).
# Manually digitized from a plotted curve --- approximate, not tabulated data.
