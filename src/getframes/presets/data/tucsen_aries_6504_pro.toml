# Tucsen Aries 6504 Pro — GSENSE6504BSI single-photon-level sCMOS.
# Manufacturer datasheet:
# https://www.tucsen.com/aries-6504-pro-product/
name = "Tucsen Aries 6504 Pro"
manufacturer = "Tucsen"
model = "Aries 6504 Pro (GSENSE6504BSI)"
sensor_type = "SCMOS"
resolution = [2048, 2048]
pixel_size_um = 6.5
quantum_efficiency = 0.95              # peak at 450 nm
full_well_e = 15000.0                  # HDR mode
bit_depth = 16
gain_e_per_adu = 0.25                  # representative sensitive-mode conversion
bias_offset_adu = 100.0
read_noise_e = 0.43                    # RMS, sensitive mode
read_noise_nonuniformity = 0.2
dark_current_e_per_s = 0.01
dark_current_ref_temp_c = -20.0
dark_current_doubling_temp_c = 6.0
prnu = 0.003                           # published 0.3%
dark_current_nonuniformity = 0.23
read_noise_rts_fraction = 0.016   # RTS tail carried over from characterised hardware (see banner)
read_noise_rts_factor = 2.65
supported_binnings = [1, 2, 4]         # Mosaic sum binning on original pixel data (digital post-read)
binning_method = "digital"
notes = "Sensitive-mode read noise with HDR-mode full well; QE x fill-factor curve digitized from Gpixel's published GSENSE6504BSI plot. Speed mode (0.80 e-) is an alternate read mode, offered at 1x1 only here. Mosaic documents binning as sum on original pixel data with unchanged data volume/frame rate; modeled as digital post-read summation. Confirm Aries-specific SDK behavior and ROI timing before final design."

# Dark-signal non-uniformity carried over from characterised hardware, not from this
# camera's datasheet. Three back-illuminated sCMOS cameras measured against real dark
# stacks (KURO 1200B 0.23, Prime 95B 0.33, Marana 4.2B-11 0.11) all sat roughly an
# order of magnitude above the ~0.03 that had been assumed here; 0.23 is their median.
# Treat it as a realistic default rather than a specification --- re-characterise if
# DSNU matters quantitatively for your work.
# The RTS terms are likewise carried over: all three measured sensors put 0.4-0.5% of
# pixels above 3x the median read noise, where a bare log-normal predicts ~0.01%.
# These are the pixels that limit faint-source detection, so leaving them out makes a
# simulated sensor optimistic at threshold.

[extra]
body_dimensions_mm = [80.0, 80.0, 108.0]
body_dimensions_order = "width, height, depth; bare camera body only, excluding connectors and adapters"
readout_modes = ["sensitive", "HDR", "speed"]
source_modes_url = "https://www.tucsen.com/aries-6504-pro-product/"
binning_source_url = "https://www.tucsen.com/uploads/Mosaic2.4_EN.pdf"

# Alternate read (operating) modes: distinct read-noise points. Sensitive supports
# the config-level 1/2/4 binnings; speed is characterized at 1x1 only.
[[extra.read_modes]]
name = "sensitive"
read_noise_e = 0.43
dark_current_e_per_s = 0.01
temperature_c = -20.0
full_frame_max_hz = 99.0

[[extra.read_modes]]
name = "speed"
read_noise_e = 0.80
dark_current_e_per_s = 0.01
temperature_c = -20.0
supported_binnings = [1]
full_frame_max_hz = 297.0

