# Princeton Instruments KURO 1200B — back-illuminated scientific CMOS.
# Manufacturer specifications:
# https://www.teledynevisionsolutions.com/products/kuro/?model=KURO-1200B
name = "Princeton Instruments KURO 1200B"
manufacturer = "Princeton Instruments"
model = "KURO 1200B"
sensor_type = "SCMOS"
resolution = [1200, 1200]
pixel_size_um = 11.0
quantum_efficiency = 0.95
full_well_e = 80000.0
bit_depth = 16
gain_e_per_adu = 0.8673                 # measured; test report quotes 0.87
bias_offset_adu = 99.91                  # measured
read_noise_e = 1.6597                 # measured: median 1.62 e-, 25-75 pct 1.44-1.87
read_noise_nonuniformity = 0.2469                 # measured log-normal core
dark_current_e_per_s = 0.825                  # measured median
dark_current_ref_temp_c = -20.0                  # temperature of the measurement
dark_current_doubling_temp_c = 6.0
prnu = 0.005
nonlinearity = 0.005
dark_current_nonuniformity = 0.234                  # measured; was 0.03, an order of magnitude low
supported_binnings = [1, 2, 4]               
binning_method = "digital"
notes = "Gain, read noise, dark current, bias and the non-uniformity terms were characterised from real 16-bit high-sensitivity darks at -20 C (see the measured-values banner); the measured gain agrees with the unit test report (0.87 e-/ADU). Published QE curve retained. The 12-bit high-speed readout is a different operating point entirely (measured 2.19 e-/ADU, 2.96 e- read noise) --- re-characterise if you use it. No on-chip binning documented for this sCMOS family; any software summing is digital."

# --- Measured values, cross-validated against real dark frames -----------------
# Conversion gain, read noise, dark current, bias and the non-uniformity terms
# below were fitted from a per-pixel dark photon-transfer analysis of 200 dark
# frames per exposure at -20 C, 16-bit high-sensitivity readout. The gain is the LOW-SIGNAL leg of this
# dual-gain mode, i.e. the regime that applies to dark, bias and faint-source
# work; a full-range gain figure for the same camera will be higher.
read_noise_rts_fraction = 0.0171                 # measured RTS tail: 0.5% of pixels above 3x median
read_noise_rts_factor = 2.669                  # measured

[extra]
readout_modes = ["12-bit", "16-bit", "rolling shutter", "effective global shutter"]
source_modes_url = "https://www.teledynevisionsolutions.com/learn/learning-center/imaging-fundamentals/new-scientific-cmos-cameras-with-back-illuminated-technology/"

