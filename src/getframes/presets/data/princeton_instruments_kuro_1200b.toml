# Princeton Instruments KURO 1200B — back-illuminated scientific CMOS.
# Manufacturer specifications:
# https://www.teledynevisionsolutions.com/products/kuro/?model=KURO-1200B
name = "Princeton Instruments KURO 1200B"
manufacturer = "Princeton Instruments"
model = "KURO 1200B"
sensor_type = "SCMOS"
resolution = [1200, 1200]
pixel_size_um = 11.0
quantum_efficiency = 0.95
full_well_e = 80000.0
bit_depth = 16
gain_e_per_adu = 1.25                 # representative 80 ke-/16-bit conversion
bias_offset_adu = 100.0
read_noise_e = 1.3                    # RMS
read_noise_nonuniformity = 0.2
dark_current_e_per_s = 0.7
dark_current_ref_temp_c = -25.0       # representative cooled operating point
dark_current_doubling_temp_c = 6.0
prnu = 0.005
nonlinearity = 0.005
dark_current_nonuniformity = 0.03
notes = "Published peak-QE/full-frame specification; characterize the selected readout mode for quantitative work."

[extra]
supported_binning = ["software/off-chip only"]
binning_implementation = "No on-chip binning documented for this sCMOS family; software summing occurs after read noise."
readout_modes = ["12-bit", "16-bit", "rolling shutter", "effective global shutter"]
source_modes_url = "https://www.teledynevisionsolutions.com/learn/learning-center/imaging-fundamentals/new-scientific-cmos-cameras-with-back-illuminated-technology/"

