# QHYCCD QHY530 Pro II — Sony IMX530 global-shutter BSI CMOS.
# Manufacturer specifications: https://www.qhyccd.com/qhy530pro-ii/
name = "QHYCCD QHY530 Pro II"
manufacturer = "QHYCCD"
model = "QHY530 Pro II (Sony IMX530)"
sensor_type = "CMOS"
resolution = [4608, 5328]
pixel_size_um = 2.74
quantum_efficiency = 0.40              # representative response near 0.75 um
full_well_e = 9700.0
bit_depth = 12
gain_e_per_adu = 2.4                  # representative full-well/ADC conversion
bias_offset_adu = 100.0
read_noise_e = 1.17                   # maximum-gain operating point; applies to 1x1 and 2x2 FD modes
dark_current_e_per_s = 0.001
dark_current_ref_temp_c = -20.0
dark_current_doubling_temp_c = 6.0
prnu = 0.01
dark_current_nonuniformity = 0.03
supported_binnings = [1, 2]            # 2x2 FD charge-domain (on-chip): one read per super-pixel
binning_method = "on_chip"
notes = "Global-shutter IMX530; QE is an I-band operating assumption, while geometry/noise/dark/full well are published specifications. The documented true charge-domain binning mode is 2x2 FD (on-chip): maximum-gain read noise is approximately 1.17 e- in both 1x1 and 2x2 modes. 2x2 raises full-frame rate to 61 fps (USB3, 8-bit)."

[extra]
source_modes_url = "https://www.qhyccd.com/qhy530pro-ii/"

