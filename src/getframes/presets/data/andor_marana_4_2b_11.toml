# Andor Marana 4.2B-11 — 11 um back-illuminated scientific CMOS.
# Manufacturer specifications:
# https://andor.oxinst.com/products/scmos-camera-series/marana-scmos
name = "Andor Marana 4.2B-11"
manufacturer = "Andor"
model = "Marana 4.2B-11"
sensor_type = "SCMOS"
resolution = [2048, 2048]
pixel_size_um = 11.0
quantum_efficiency = 0.95
full_well_e = 85000.0
bit_depth = 16
gain_e_per_adu = 0.8008                 # measured; NOT the 1.2-1.4 full-range figure
bias_offset_adu = 99.70                  # measured
read_noise_e = 1.0763                 # measured: median 1.05 e-, 25-75 pct 0.89-1.22
read_noise_nonuniformity = 0.2444                 # measured log-normal core
dark_current_e_per_s = 0.3276                 # measured, glow-subtracted
dark_current_ref_temp_c = -45.0                  # temperature of the measurement
dark_current_doubling_temp_c = 6.0
prnu = 0.005                          # published <0.5% at half range
nonlinearity = 0.003                  # published linearity >99.7%
dark_current_nonuniformity = 0.110                  # measured on the glow-free interior
hot_pixel_fraction = 0.0001               # measured: 1.0e-4 of pixels above 10x the median dark rate
hot_pixel_factor = 15.0                  # consistent with that threshold; tail not resolved
supported_binnings = [1, 2, 3, 4, 8]    # FPGA post-readout (digital) summation
binning_method = "digital"
notes = "Values below the measured-values banner, plus gain/read noise/dark current/bias, were characterised from real 16-bit HDR darks at -45 C (see the banner). This sensor shows edge-concentrated amplifier glow, modelled via detector_glow_edge_scale_px; the dark_current_e_per_s figure is the glow-subtracted base rate. Published QE curve retained. FPGA post-readout binning does not reduce the sCMOS readout time."

# --- Measured values, cross-validated against real dark frames -----------------
# Conversion gain, read noise, dark current, bias and the non-uniformity terms
# below were fitted from a per-pixel dark photon-transfer analysis of 150 dark
# frames per exposure at -45 C, 16-bit HDR readout. The gain is the LOW-SIGNAL leg of this
# dual-gain mode, i.e. the regime that applies to dark, bias and faint-source
# work; a full-range gain figure for the same camera will be higher.
read_noise_rts_fraction = 0.0162                 # measured RTS tail: 0.4% of pixels above 3x median
read_noise_rts_factor = 2.590                  # measured
detector_glow_e_per_s = 0.0085                 # measured edge glow, array mean
detector_glow_edge_scale_px = 37.0                   # measured exponential falloff from the array edge

[extra]
readout_modes = ["16-bit high dynamic range", "12-bit fast speed"]
roi_minimum_pixels = [25, 1]
source_modes_url = "https://andor.oxinst.com/downloads/uploads/Andor_Marana_Specifications.pdf"

# Marana 4.2B-11 sensor QE from Andor's published camera-window selector data
# (selector key SONA11MARA11). The optical window and instrument throughput are
# separate spectral terms and are not folded into this curve.
# https://andor.oxinst.com/tools/camera-window-selector
[qe_curve]
wavelength_nm = [200.0, 240.0, 300.0, 350.0, 400.0, 450.0, 500.0, 570.0, 600.0, 650.0, 700.0, 750.0, 800.0, 850.0, 900.0, 950.0, 1000.0]
qe = [0.2912, 0.5592, 0.4411, 0.4960, 0.7003, 0.8638, 0.9188, 0.9476, 0.9248, 0.9339, 0.8406, 0.7273, 0.6428, 0.5062, 0.3465, 0.2242, 0.1019]
