# Andor CB1 0.5 MP — Sony IMX426 global-shutter sCMOS.
# Manufacturer specification sheet:
# https://andor.oxinst.com/assets/uploads/products/andor/documents/c-blue-one-specifications.pdf
name = "Andor CB1 0.5 MP"
manufacturer = "Andor / First Light Imaging"
model = "CB1 0.5 MP (Sony IMX426)"
sensor_type = "SCMOS"
resolution = [816, 624]
pixel_size_um = 9.0
quantum_efficiency = 0.73
full_well_e = 94000.0
bit_depth = 12
gain_e_per_adu = 1.0
bias_offset_adu = 100.0
read_noise_e = 2.35
dark_current_e_per_s = 1.39
dark_current_ref_temp_c = 10.0
dark_current_doubling_temp_c = 6.0
notes = "CB1 0.5 MP high-gain / 24 dB mode: 2.35 e- typical read noise at 50 us. The specification sheet gives 1594 fps at 8 bit and 941 fps at 12 bit; the profile uses the 12-bit trade mode. QE is the full published CB1 spectral-response plot for the visible Sony Pregius family, with a 73% IMX426 check at 529 nm from Allied Vision."

[extra]
body_dimensions_mm = [154.3, 76.2, 64.1]
body_dimensions_order = "length, width, height; confirm mounting/cable clearance in the Keck envelope"
supported_binning = ["1x1"]
binning_implementation = "No 2x2 binning is offered for the CB1 0.5 MP model."
readout_modes = ["8-bit", "12-bit", "14-bit HDR"]
source_modes_url = "https://andor.oxinst.com/assets/uploads/products/andor/documents/c-blue-one-specifications.pdf"

# CB1's manufacturer QE plot manually digitized at 25--50 nm spacing. The
# curve is typical (not guaranteed) and represents the visible IMX426 response;
# it is independently consistent with Allied Vision's 73% QE at 529 nm for
# the same IMX426 sensor. Camera window and Keck throughput are separate.
