[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "getframes"
description = "Generate physically realistic synthetic camera frames (CCD/CMOS/EMCCD/eAPD/sCMOS) — dark, bias, flat, and rendered star fields — with auditable noise physics for scientific imaging pipelines."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jacob Taylor", email = "jacobataylor7@gmail.com" }]
keywords = [
    "astronomy",
    "ccd",
    "cmos",
    "emccd",
    "camera",
    "detector",
    "simulation",
    "noise",
    "imaging",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
    "astropy>=5.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.6",
    "mypy>=1.8",
    "build>=1.0",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]
examples = [
    "matplotlib>=3.7",
]
gpu = ["cupy-cuda12x>=13.0"]

[project.scripts]
getframes = "getframes.cli:main"

[project.urls]
Homepage = "https://github.com/jacotay7/getframes"
Documentation = "https://jacotay7.github.io/getframes/"
Repository = "https://github.com/jacotay7/getframes"
Issues = "https://github.com/jacotay7/getframes/issues"
Changelog = "https://github.com/jacotay7/getframes/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/getframes/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/getframes"]

[tool.hatch.build.targets.sdist]
include = [
    "src/getframes",
    "tests",
    "examples",
    "benchmarks",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "NPY", # numpy-specific rules
    "RUF",
]
ignore = ["B905"]

[tool.ruff.lint.isort]
known-first-party = ["getframes"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = []
files = ["src/getframes"]

[[tool.mypy.overrides]]
module = ["matplotlib.*", "astropy.*", "scipy.*", "tomli", "cupy.*", "cupyx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["gpu: optional CuPy/CUDA detector tests"]

[tool.coverage.run]
source = ["getframes"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
