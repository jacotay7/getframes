site_name: getframes
site_description: Realistic synthetic camera frames for scientific imaging pipelines
site_url: https://jacotay7.github.io/getframes/
repo_url: https://github.com/jacotay7/getframes
repo_name: jacotay7/getframes
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Guides:
      - Getting started: guides/getting-started.md
      - The noise model: guides/noise-model.md
      - Calibration & ground truth: guides/calibration.md
      - Observing scenes: guides/scenes.md
      - Time series & observations: guides/time-series.md
      - Spectral mode: guides/spectral.md
      - Radiometry & the infrared: guides/radiometry.md
      - Scale & datasets: guides/datasets.md
      - Camera presets: guides/presets.md
  - API reference: reference.md
  - API stability: stability.md
  - Roadmap: roadmap.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            members_order: source

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true
